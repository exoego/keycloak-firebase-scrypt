name: CI
on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java:
          - 17.0.20+101
          - 21.0.12+101.0.LTS
          - 25.0.4+101.0.LTS
    steps:
      - uses: actions/checkout@v7

      # Gradle compiles with JDK 21 and runs the tests with the JDK of the matrix.
      # The last version becomes JAVA_HOME.
      - name: Set up JDKs
        uses: actions/setup-java@v6
        with:
          java-version: |
            ${{ matrix.java }}
            21.0.12+101.0.LTS
          distribution: 'temurin'
          # The pinned versions do not match the JDKs preinstalled on the runner, so cache the downloads.
          # Gradle files are cached by setup-gradle, so do not set "cache: gradle" here.
          cache-jdk: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # The integration tests start Keycloak with Testcontainers, using the Docker of the runner.
      - name: Run Tests
        env:
          MATRIX_JAVA: ${{ matrix.java }}
        run: ./gradlew check -PtestJavaVersion="${MATRIX_JAVA%%.*}"
