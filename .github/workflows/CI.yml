name: CI
on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java:
          - 17
          - 21
          - 25
    steps:
      - uses: actions/checkout@v7

      # Gradle compiles with JDK 21 and runs the tests with the JDK of the matrix.
      # The last version becomes JAVA_HOME.
      - name: Set up JDKs
        uses: actions/setup-java@v6
        with:
          java-version: |
            ${{ matrix.java }}
            21
          distribution: 'temurin'
          # Gradle files are cached by setup-gradle, so do not set "cache: gradle" here.

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # The integration tests start Keycloak with Testcontainers, using the Docker of the runner.
      - name: Run Tests
        run: ./gradlew check jacocoTestReport -PtestJavaVersion=${{ matrix.java }}

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/jacoco/test/jacocoTestReport.xml
          disable_search: true
          name: java-${{ matrix.java }}
          fail_ci_if_error: true

  # A skipped required job counts as passed, so fail instead of skipping.
  result:
    name: CI result
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        if: needs.test.result != 'success'
        run: exit 1

      - name: Send Codecov notifications
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          run_command: send-notifications
          fail_ci_if_error: true
