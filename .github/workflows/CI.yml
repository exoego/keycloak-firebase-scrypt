name: CI

permissions: {}

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Java ${{ matrix.java }}${{ matrix.keycloak && format(', Keycloak {0}', matrix.keycloak) || '' }})
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        java:
          - 17
          - 21
          - 25
        # Empty means the Keycloak version of the catalog. It keeps the rows below from merging into the Java 21 row.
        keycloak:
          - ''
        # The last release of each older major. The provider runs in the JDK of the Keycloak image, so one test JDK is enough.
        include:
          - java: 21
            keycloak: 24.0.5
          - java: 21
            keycloak: 25.0.6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Gradle compiles with JDK 21 and runs the tests with the JDK of the matrix.
      # The last version becomes JAVA_HOME.
      - name: Set up JDKs
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: |
            ${{ matrix.java }}
            21
          distribution: 'temurin'
          # Gradle files are cached by setup-gradle, so do not set "cache: gradle" here.

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # The integration tests start Keycloak with Testcontainers, using the Docker of the runner.
      - name: Run Tests
        env:
          KEYCLOAK_VERSION: ${{ matrix.keycloak }}
        run: ./gradlew check jacocoTestReport -PtestJavaVersion=${{ matrix.java }} -PtestKeycloakVersion="$KEYCLOAK_VERSION"

      # The coverage comes from the unit tests, which do not depend on the Keycloak version.
      - name: Upload coverage
        if: matrix.keycloak == ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/jacoco/test/jacocoTestReport.xml
          disable_search: true
          name: java-${{ matrix.java }}
          fail_ci_if_error: true

  # A skipped required job counts as passed, so fail instead of skipping.
  result:
    name: CI result
    timeout-minutes: 5
    if: always()
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check matrix result
        if: needs.test.result != 'success'
        run: exit 1

      - name: Send Codecov notifications
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          run_command: send-notifications
          fail_ci_if_error: true
